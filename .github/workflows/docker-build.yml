name: Build and Push Docker Images

on:
  push:
    branches:
      - develop
  workflow_dispatch:    

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./local-llms-ollama
          file: ./local-llms-ollama/Dockerfile
          push: true
          tags: |
            ghcr.io/markbenjaminkatamba/dockerfile-generator-backend-dev:${{ github.ref_name }}
            ghcr.io/markbenjaminkatamba/dockerfile-generator-backend-dev:${{ github.ref_name }}-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/markbenjaminkatamba/dockerfile-generator-frontend-dev:${{ github.ref_name }}
            ghcr.io/markbenjaminkatamba/dockerfile-generator-frontend-dev:${{ github.ref_name }}-${{ github.sha }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: markbenjaminkatamba/homelab-gitops
          path: homelab-gitops
          token: ${{ secrets.HOMELAB_GITOPS_TOKEN }}
          persist-credentials: true          

      - name: Update image tags in homelab-dev overlay
        run: |
          sed -i "s|dockerfile-generator-backend-dev:.*|dockerfile-generator-backend-dev:${GITHUB_REF_NAME}-${GITHUB_SHA}|" homelab-gitops/apps/overlays/homelab-dev/dockerfile-generator-backend/version.yaml
          sed -i "s|dockerfile-generator-frontend-dev:.*|dockerfile-generator-frontend-dev:${GITHUB_REF_NAME}-${GITHUB_SHA}|" homelab-gitops/apps/overlays/homelab-dev/dockerfile-generator-frontend/version.yaml

      - name: Commit and push changes
        run: |
          cd homelab-gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git status --porcelain | grep .; then
            git add .
            git commit -m "Update dockerfile-generator images to ${GITHUB_REF_NAME}-${GITHUB_SHA}"
            git push
          else
            echo "No changes to commit"
          fi
